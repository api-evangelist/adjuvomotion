note: >-
  Adjuvo Motion publishes no HTTP contract, so every web-API cross-cutting standard below is recorded
  as not-applicable-and-absent rather than as a failure: there is no request/response surface for
  OAuth, RFC 9457 problem details, JSON:API or HTTP pagination to conform to. The standards that DO
  apply to this market are XR and robotics interface standards, and the provider makes one explicit,
  citable conformance claim in its own documentation (OpenXR hand tracking).
conformance:
- id: openxr-hand-tracking
  name: OpenXR — hand tracking (XR_EXT_hand_tracking style interface)
  category: domain-standard
  domain: extended-reality
  conforms: true
  evidence: >-
    https://unreal.docs.senseglove.com/next/advanced-topics/openxr/third-party-integrations/index.html
    — "The SenseGlove Unreal Engine Plugin registers itself as an `OpenXRHandTracking` provider,
    making it a fully compatible, drop-in replacement for Epic's own OpenXRHandTracking plugin" and
    "As the SenseGlove Unreal Engine Plugin is fully OpenXR-compliant, it provides OpenXR
    hand-tracking data in the expected format."
  note: >-
    This is the domain-standard signature for this provider's market. A consumer already consuming
    OpenXR hand-tracking data integrates a SenseGlove with no bespoke connector; only the haptic
    output path (force feedback, vibrotactile, wrist squeeze) requires calling SenseGlove's own API,
    because OpenXR hand tracking has no haptic-output equivalent. The claim is made for the Unreal
    plugin specifically — it is not asserted for the Unity plugin or the native Core API.
