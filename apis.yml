apis:
- aid: adjuvomotion:senseglove-core-api
  name: SenseGlove Core API
  position: Producing
  humanURL: https://www.senseglove.com/developer/
  image: https://www.senseglove.com/wp-content/uploads/2022/05/SenseGlove-home-featured.jpg
  description: >-
    The SenseGlove Core API is a native C++ and C# library (SGCore namespace) that reads sensor and
    hand-pose data from, and sends force-feedback, vibrotactile and wrist-squeeze commands to,
    SenseGlove hardware. It is distributed as headers plus per-platform .lib/.dll binaries from the
    SenseGlove-API GitHub repository and talks to devices through the SGConnect library / SenseCom
    background process. It is an in-process device API, not an HTTP endpoint, so it declares no
    baseURL, no authentication scheme and no rate limits.
  tags:
  - Haptics
  - SDK
  - Hardware
