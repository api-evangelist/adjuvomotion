aid: adjuvomotion
name: Adjuvo Motion
description: >-
  Adjuvo Motion B.V. trades publicly as SenseGlove, a Dutch haptics company headquartered at the
  Katoenhuis in Rotterdam with engineering roots in Delft. It designs and manufactures force-feedback
  and vibrotactile gloves for virtual and extended reality — the Nova 2, the Nova and the DK1 — plus
  the R1 exoskeleton glove used for tele-robotics and imitation learning, sold into immersive
  training, virtual prototyping, academic research and humanoid robotics. Its developer surface is a
  native device API rather than a web service: a C++ and C# Core API in the SGCore namespace, the
  SGConnect communications library, the SenseCom desktop daemon, first-party Unity and Unreal Engine
  plugins, ROS 1 workspaces and a Python API for the R1. No public HTTP, REST or GraphQL API is
  published.
